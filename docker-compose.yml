version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: narrator
      POSTGRES_PASSWORD: narrator
      POSTGRES_DB: narrator
    ports:
      - '5432:5432'
    volumes:
      - narrator_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://narrator:narrator@postgres:5432/narrator
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ['node', 'dist/videos/videos.worker.js']
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://narrator:narrator@postgres:5432/narrator
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  narrator_postgres_data:
